name: Pages

# Deploys flashpilot.jrtx.site from site/ (bilingual product homepage)
# plus the user guide (docs/guide.html, staged in as /guide.html).
# Pages must be enabled with the "GitHub Actions" build type.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/guide.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the user guide into the site
        run: cp docs/guide.html site/guide.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
